name: roundup
# Weekly AI roundup reel built from primary-source pages (roundup.py). Manual only; publishes
# nothing. The mp4 is pushed to the 'roundup-preview' branch and attached as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q espeak-ng
      - run: pip install -q -r requirements.txt
      - name: build roundup
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: python roundup.py roundup.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: roundup
          path: roundup.mp4
      - name: push to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan roundup-preview
          git rm -rf -q --cached . 
          git add -f roundup.mp4
          git commit -qm "roundup preview"
          git push -f origin roundup-preview
