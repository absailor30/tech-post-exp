name: series-post
# "100 AI repos worth knowing": one repo post per day, from repos.json.
# Independent of the news slots; its own once-a-day guard lives in
# series_state.json, so the backup firings below just no-op after a success.
on:
  schedule:
    - cron: "30 3 * * *"        # 09:00 IST primary
    - cron: "30 4 * * *"        # backup (no-ops if already posted today)
    - cron: "30 6 * * *"        # last resort
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if the series already posted today"
        type: boolean
        default: false
      dry:
        description: "Preview only: render and print the plan, publish nothing, save no state"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ig-agent               # shared with daily-post so two runs never race on main
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q espeak-ng
      - run: pip install -q -r requirements.txt
      - name: run series agent
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          DM_LINK: ${{ secrets.DM_LINK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read-only repo facts for the series
          REPO_DIR: ${{ github.workspace }}
          GIT_NAME: github-actions[bot]
          GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python autonomous_run.py --series ${{ inputs.force && '--force' || '' }} ${{ inputs.dry && '--dry' || '' }}
      - name: telegram summary
        if: success() && !inputs.dry
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py --post-summary
      - name: telegram failure alert
        if: failure() && !inputs.dry
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py --failure series-post
      - name: save preview to this branch (dry runs only)
        if: success() && inputs.dry && github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "preview: series dry run"
          git push
      - name: persist state
        if: always() && !inputs.dry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "state: series run"
          git pull --rebase && git push
