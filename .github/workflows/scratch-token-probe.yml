name: scratch-token-probe
on:
  workflow_dispatch: {}

# Throwaway diagnostic -- safe to delete once the /me vs explicit-id
# question is settled.
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: probe /me vs explicit account id
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scratch_token_probe.py
