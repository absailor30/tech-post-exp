name: daily-post
on:
  schedule:
    # Two posts a day. Each slot is a UTC hour window in autonomous_run.py
    # (morning 05:00-13:00, evening 13:00-23:00) wide enough to cover its own
    # primary + backup + last-resort — already_posted_in_slot() no-ops any
    # extra firing within the same window, and a slot's retries never touch
    # the other slot's post.
    - cron: "0 7 * * *"         # 07:00 UTC = 12:30 IST (morning primary)
    - cron: "45 7 * * *"        # morning backup — no-ops if already posted
    - cron: "0 9 * * *"         # morning last-resort
    - cron: "0 15 * * *"        # 15:00 UTC = 20:30 IST (evening primary)
    - cron: "45 15 * * *"       # evening backup — no-ops if already posted
    - cron: "0 17 * * *"        # evening last-resort
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if this slot already posted today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ig-agent
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: run agent
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          DM_LINK: ${{ secrets.DM_LINK }}
          REPO_DIR: ${{ github.workspace }}
          GIT_NAME: github-actions[bot]
          GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python autonomous_run.py ${{ inputs.force && '--force' || '' }}
      - name: persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "state: post run"
          git pull --rebase && git push
      - name: telegram summary
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py --post-summary
      - name: telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py --failure daily-post
