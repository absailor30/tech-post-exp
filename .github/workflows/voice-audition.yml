name: voice-audition
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q espeak-ng
      - run: pip install -q -r requirements.txt
      - run: python voice_audition.py
      - name: save samples to this branch
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_samples
          git commit -m "voice samples" || true
          git pull --rebase origin "${{ github.ref_name }}" && git push
