name: veo-probe
on:
  workflow_dispatch: {}

# Throwaway verification only -- confirms GCP_SA_KEY + GCP_PROJECT actually
# reach Veo before any of this is wired into the real posting pipeline.
# Safe to delete once Veo integration lands in daily-post.yml for real.

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-auth requests
      - run: pip install -q -r requirements.txt
      - name: audition voices
        env:
          NIM_API_KEY: x
        run: python voice_audition.py
      - name: commit audition to this branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audition
          git commit -m 'audition: voice samples' && git push || true
