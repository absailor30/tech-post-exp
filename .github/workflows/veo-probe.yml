name: veo-probe
on:
  workflow_dispatch: {}

# Throwaway verification only -- confirms GCP_SA_KEY + GCP_PROJECT actually
# reach Veo before any of this is wired into the real posting pipeline.
# Safe to delete once Veo integration lands in daily-post.yml for real.

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q espeak-ng
      - run: pip install -q -r requirements.txt
      - name: remix audio onto the existing Day 1 video
        env:
          NIM_API_KEY: x
        run: python remix_audio.py
      - name: commit result to this branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add images
          git commit -m 'remix: day 1 audio levels' && git stash --include-untracked || true
          git pull --rebase origin "${{ github.ref_name }}" && git push
